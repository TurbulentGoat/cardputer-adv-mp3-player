; Cardputer MP3 player — M5Stack Cardputer ADV (also runs on the original Cardputer)
;
; pioarduino = Arduino-ESP32 3.3.x on ESP-IDF 5.5. ESP8266Audio needs IDF 5's
; I2S API, so the stock platformio/espressif32 (Arduino 2.x) will NOT build this.

[env:cardputer-adv]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = m5stack-stamps3
framework = arduino

board_build.partitions = default_8MB.csv
board_build.flash_mode = dio
monitor_speed = 115200
upload_speed = 1500000

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -O2

build_unflags = -Os

; Pinned to the exact versions this was built and checked against.
lib_deps =
    https://github.com/m5stack/M5GFX.git#0.2.36
    https://github.com/m5stack/M5Unified.git#0.2.29
    https://github.com/m5stack/M5Cardputer.git#1.2.0
    ; release archive rather than git: the repo's submodules aren't needed to build
    https://github.com/earlephilhower/ESP8266Audio/archive/refs/tags/2.4.2.zip

; M5Cardputer declares IRremote as a dependency; it isn't used here.
lib_ignore = IRremote
